<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mederi v0.5 · 原型批注</title>
<style>
:root{color-scheme:light;--ink:#242438;--muted:#555972;--line:#dedfed;--accent:#4945a8;--tint:#efeeff;--surface:#fff;--shadow:0 14px 40px #25254226;--gap:8px;--radius:9px}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--surface);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}
header{flex:none;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:var(--gap);padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.group{min-width:0;display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap}
.brand{font-weight:650;white-space:nowrap}
button,textarea{font:inherit}
button{cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);min-height:38px;padding:6px 12px}
button:hover,button[aria-pressed=true]{background:var(--tint);color:var(--accent);border-color:#bdbaf0}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
iframe{flex:1;min-height:0;display:block;width:100%;border:0}
.hint,.status{color:var(--muted);font-size:13px}
.hint:empty{display:none}
.drawer{position:fixed;z-index:3;right:14px;top:62px;width:min(355px,calc(100% - 28px));max-height:calc(100dvh - 76px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.drawer[hidden],.view[hidden]{display:none}
.view{padding:15px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:var(--gap);margin-bottom:8px}
.drawer-head h1,.drawer-head h2{font-size:16px;margin:0}
.target{margin:0 0 12px;color:var(--muted);overflow-wrap:anywhere}
textarea{width:100%;min-height:125px;resize:vertical;border:1px solid #b9bbd1;border-radius:var(--radius);padding:9px;color:var(--ink);background:var(--surface)}
.status{margin:8px 0 0;min-height:20px}
.warning{color:#805011}
#notes-list{list-style:none;margin:0;padding:0;display:grid;gap:var(--gap)}
#notes-list button{width:100%;text-align:left;white-space:normal;overflow-wrap:anywhere}
#notes-list span{display:block;color:var(--muted);white-space:pre-wrap}
@media(max-width:680px){header{align-items:flex-start;flex-wrap:wrap;padding:7px 8px}.brand{display:none}.hint{flex-basis:100%}.drawer{top:auto;bottom:10px;right:8px;width:calc(100% - 16px);max-height:55dvh}}
</style>
</head>
<body>
<header aria-label="批注工具">
  <div class="group" role="group" aria-label="操作模式">
    <span class="brand">Mederi v0.5</span>
    <button type="button" id="operate" aria-pressed="true">操作原型</button>
    <button type="button" id="annotate" aria-pressed="false">标注元素</button>
    <span id="hint" class="hint" role="status"></span>
  </div>
  <div class="group">
    <button type="button" id="notes">备注 <span id="count">0</span></button>
    <button type="button" id="export" disabled>导出备注</button>
  </div>
</header>
<iframe id="prototype" title="Mederi v0.5 工作台原型" sandbox="allow-scripts"></iframe>
<aside class="drawer" id="drawer" aria-label="元素备注" hidden>
  <div class="view" id="editor" hidden>
    <div class="drawer-head"><h1><label for="note">元素备注</label></h1><button type="button" data-close>完成</button></div>
    <p class="target" id="target"></p>
    <textarea id="note" placeholder="写下这个元素是什么、点了以后做什么……"></textarea>
    <p class="status" id="save-status" role="status"></p>
  </div>
  <div class="view" id="index" hidden>
    <div class="drawer-head"><h2>已写备注</h2><button type="button" data-close>关闭</button></div>
    <p id="empty" class="target">还没有备注。切到「标注元素」后直接点原型。</p>
    <ul id="notes-list"></ul>
  </div>
</aside>

  function installBridge(protocol) {
    'use strict';
    const focusable = 'button,a,input,textarea,select,summary,[role=button],[role=tab],[contenteditable=true]';
    const metadata = ['aria-label', 'title', 'placeholder', 'alt'];
    const drawing = 'svg,svg *';
    const identityAttributes = /^data-(open|go|doc$|task$|source|ov|select|quick|filter|choose|dropstatus)/;
    const identityLimit = 180;
    const labelLimit = 100;
    let enabled = false;
    let hovered = null;
    let selectedElement = null;
    const outline = document.createElement('div');
    outline.setAttribute('aria-hidden', 'true');
    outline.style.cssText = 'position:fixed;display:none;pointer-events:none;z-index:2147483646;border:2px solid #6258e5;border-radius:4px;box-shadow:0 0 0 2px #fff9;box-sizing:border-box;background:#6258e514';
    document.body.append(outline);

    function paint(element) {
      if (!element || !element.isConnected || !element.getClientRects().length) {
        outline.style.display = 'none';
        return;
      }
      const rect = element.getBoundingClientRect();
      if (rect.bottom <= 0 || rect.top >= innerHeight || rect.right <= 0 || rect.left >= innerWidth) {
        outline.style.display = 'none';
        return;
      }
      outline.style.display = 'block';
      outline.style.top = rect.top + 'px';
      outline.style.left = rect.left + 'px';
      outline.style.width = rect.width + 'px';
      outline.style.height = rect.height + 'px';
    }

    function clickableElement(target) {
      if (!(target instanceof Element)) return null;
      const element = target.closest(focusable) || (target.matches(drawing) ? target.closest('svg') : target);
      return element === document.body || element === document.documentElement ? null : element;
    }

    function describe(element) {
      const name = metadata.map(attribute => element.getAttribute(attribute)?.trim()).find(Boolean);
      const text = name || element.textContent.replace(/\s+/g, ' ').trim() || element.id || element.tagName.toLowerCase();
      return text.slice(0, labelLimit);
    }

    function selectorFor(element) {
      const parts = [];
      for (let node = element; node && node !== document.body; node = node.parentElement) {
        if (node.id && document.getElementById(node.id) === node) {
          parts.unshift('#' + CSS.escape(node.id));
          return parts.join(' > ');
        }
        const name = node.localName;
        const identities = node.getAttributeNames().filter(attribute => {
          return identityAttributes.test(attribute) && (node.getAttribute(attribute)?.length || 0) <= identityLimit;
        });
        const keyed = name + identities.map(attribute => '[' + attribute + '="' + CSS.escape(node.getAttribute(attribute)) + '"]').join('');
        const distinct = identities.length && [...node.parentElement.children].filter(sibling => sibling.matches(keyed)).length === 1;
        const position = [...node.parentElement.children].filter(sibling => sibling.localName === name).indexOf(node) + 1;
        parts.unshift(distinct ? keyed : name + ':nth-of-type(' + position + ')');
      }
      return 'body > ' + parts.join(' > ');
    }

    function scopeFor(element) {
      const labels = [
        ['#docDrawer', '项目文档详情'], ['#taskDrawer', '需求详情'], ['#homeView', '首页'],
        ['#boardArea', '需求看板'], ['.board-chat', '看板伴随对话'], ['#projectPane', '项目栏'],
        ['#sessionPane', '会话概览'], ['#conversation', '对话区'], ['#popup', '菜单'],
        ['#modalBackdrop', '弹窗'], ['.topbar', '顶栏']
      ];
      return labels.find(([selector]) => element.closest(selector))?.[1] || '原型';
    }

    document.addEventListener('pointermove', event => {
      if (!enabled) return;
      hovered = clickableElement(event.target);
      paint(hovered);
    }, true);
    document.addEventListener('pointerout', event => {
      if (enabled && event.relatedTarget === null) {
        hovered = null;
        paint(selectedElement);
      }
    }, true);
    for (const eventName of ['pointerdown', 'mousedown', 'dragstart']) {
      document.addEventListener(eventName, event => {
        if (!enabled || !clickableElement(event.target)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
    }
    document.addEventListener('click', event => {
      if (!enabled) return;
      const element = clickableElement(event.target);
      if (!element) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      selectedElement = element;
      paint(element);
      window.parent.postMessage({
        type: protocol.picked,
        target: {selector: selectorFor(element), label: describe(element), scope: scopeFor(element)}
      }, '*');
    }, true);
    document.addEventListener('keydown', event => {
      if (!enabled) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.parent.postMessage({type: protocol.escape}, '*');
      }
    }, true);
    window.addEventListener('resize', () => paint(enabled ? hovered || selectedElement : null));
    document.addEventListener('scroll', () => paint(enabled ? hovered || selectedElement : null), true);

    window.addEventListener('message', event => {
      if (event.source !== window.parent) return;
      if (event.data?.type === protocol.mode) {
        enabled = event.data.enabled === true;
        hovered = null;
        if (!enabled) selectedElement = null;
        paint(enabled ? selectedElement : null);
      }
      if (event.data?.type === protocol.locate) {
        let element = null;
        try { element = document.querySelector(event.data.selector); } catch { /* Old selectors can be invalid. */ }
        const visible = !!(element?.getClientRects().length && getComputedStyle(element).visibility !== 'hidden');
        selectedElement = visible ? element : null;
        hovered = null;
        if (visible) element.scrollIntoView({block:'nearest', inline:'nearest'});
        paint(selectedElement);
        window.parent.postMessage({type: protocol.location, visible}, '*');
      }
    });

    // 原型将文档抽屉放在隐藏的看板容器内。移动现成节点以使原有入口可操作。
    const documentDrawer = document.getElementById('docDrawer');
    const shell = document.getElementById('workShell');
    if (shell && documentDrawer) shell.append(documentDrawer);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && documentDrawer?.classList.contains('open')) {
        document.getElementById('closeDocDrawer')?.click();
      }
    });
    window.parent.postMessage({type: protocol.ready}, '*');
  }

  function loadNotes() {
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw === null) return;
      const notes = JSON.parse(raw);
      if (!Array.isArray(notes)) throw new TypeError('Invalid notes');
      for (const note of notes) {
        if (note && typeof note.selector === 'string' && typeof note.label === 'string' &&
            typeof note.scope === 'string' && typeof note.text === 'string' && note.text.trim()) {
          annotations.set(note.selector, note);
        }
      }
    } catch {
      storageAvailable = false;
    }
  }

  function saveNotes() {
    if (!storageAvailable) return;
    try {
      localStorage.setItem(storageKey, JSON.stringify([...annotations.values()]));
    } catch {
      storageAvailable = false;
    }
  }

  function setStatus(text, warning = false) {
    saveStatus.textContent = text;
    saveStatus.classList.toggle('warning', warning);
  }

  function refreshCount() {
    byId('count').textContent = String(annotations.size);
    byId('export').disabled = annotations.size === 0;
  }

  function showView(view) {
    drawer.hidden = false;
    editor.hidden = view !== editor;
    index.hidden = view !== index;
  }

  function closeDrawer() {
    drawer.hidden = true;
    editor.hidden = true;
    index.hidden = true;
    selected = null;
    (annotating ? byId('annotate') : byId('operate')).focus();
  }

  function setMode(enabled) {
    annotating = enabled;
    byId('annotate').setAttribute('aria-pressed', String(enabled));
    byId('operate').setAttribute('aria-pressed', String(!enabled));
    hint.textContent = enabled ? '移到元素上，点一下写备注' : '';
    if (frameReady) frame.contentWindow.postMessage({type: message.mode, enabled}, '*');
  }

  function edit(target) {
    selected = target;
    byId('target').textContent = target.scope + ' / ' + target.label;
    const existing = annotations.get(target.selector);
    textarea.value = existing?.text ?? '';
    setStatus(storageAvailable ? (existing ? '已保存到此浏览器' : '输入后自动保存') : '浏览器无法保存，请在关闭前导出。', !storageAvailable);
    showView(editor);
    textarea.focus();
  }

  function showNoteIndex() {
    const list = byId('notes-list');
    list.replaceChildren();
    byId('empty').hidden = annotations.size > 0;
    for (const note of annotations.values()) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      const name = document.createElement('strong');
      const detail = document.createElement('span');
      button.type = 'button';
      name.textContent = note.scope + ' / ' + note.label;
      detail.textContent = note.text;
      button.append(name,detail);
      button.addEventListener('click', () => {
        setMode(true);
        edit(note);
        frame.contentWindow.postMessage({type: message.locate, selector: note.selector}, '*');
      });
      item.append(button);
      list.append(item);
    }
    showView(index);
    (list.querySelector('button') || index.querySelector('button')).focus();
  }

  function exportNotes() {
    if (!annotations.size) return;
    const lines = ['# Mederi v0.5 原型备注', '', '原型 SHA-256 ' + prototypeHash, ''];
    for (const note of annotations.values()) {
      lines.push('## ' + note.scope + ' / ' + note.label, '', ...note.text.split('\n').map(line => '    ' + line), '');
    }
    const file = new Blob([lines.join('\n')], {type:'text/markdown;charset=utf-8'});
    const url = URL.createObjectURL(file);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = exportFilename;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  textarea.addEventListener('input', () => {
    if (!selected) return;
    const value = textarea.value;
    if (value.trim()) annotations.set(selected.selector, {...selected, text:value});
    else annotations.delete(selected.selector);
    saveNotes();
    refreshCount();
    setStatus(storageAvailable ? (value.trim() ? '已保存到此浏览器' : '备注已清空') : '浏览器无法保存，请在关闭前导出。', !storageAvailable);
  });
  byId('operate').addEventListener('click', () => {
    setMode(false);
    closeDrawer();
  });
  byId('annotate').addEventListener('click', () => setMode(true));
  byId('notes').addEventListener('click', showNoteIndex);
  byId('export').addEventListener('click', exportNotes);
  drawer.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', closeDrawer));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !drawer.hidden && !event.isComposing) closeDrawer();
  });
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow) return;
    if (event.data?.type === message.ready) {
      frameReady = true;
      setMode(annotating);
    }
    if (event.data?.type === message.picked && annotating) edit(event.data.target);
    if (event.data?.type === message.location && !event.data.visible) {
      setStatus('此元素在其他界面。可先切到「操作原型」进入对应页面。');
    }
    if (event.data?.type === message.escape) {
      if (!drawer.hidden) closeDrawer();
      else setMode(false);
    }
  });

  loadNotes();
  refreshCount();
  const encoded = byId('prototype-source').textContent.trim();
  const source = new TextDecoder().decode(Uint8Array.from(atob(encoded), char => char.charCodeAt(0)));
  const bridge = '<scr' + 'ipt>(' + installBridge.toString() + ')(' + JSON.stringify(message) + ');</scr' + 'ipt>';
  frame.srcdoc = source.replace('</body>', () => bridge + '</body>');
})();
</script>
</body>
</html>
