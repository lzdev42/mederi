name: Test Release Packaging

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            architecture: aarch64

          # Intel 包也在 Apple Silicon 上构建。
          - os: macos-26
            platform: macos
            arch: x64
            architecture: x64

          - os: ubuntu-latest
            platform: linux
            arch: x64
            architecture: x64

          - os: ubuntu-26.04-arm
            platform: linux
            arch: arm64
            architecture: aarch64

          - os: windows-latest
            platform: windows
            arch: x64
            architecture: x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    env:
      APP_NAME: Mederi
      ARCHIVE_EXTENSION: ${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure Rosetta 2 (macOS Intel on ARM)
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = x86_64

      - name: Setup Java 25 (JBR with JCEF)
        uses: actions/setup-java@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          java-version: '25'
          distribution: 'jetbrains'
          java-package: 'jdk+jcef'
          architecture: ${{ matrix.architecture }}

      - name: Install Linux Test Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libgtk-3-0t64 libgbm1 libnss3 libasound2t64 libgl1 libegl1 libfontconfig1

      - name: Run Tests on Target Platform
        if: matrix.platform != 'macos' || matrix.arch != 'x64'
        id: platform_tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp
          work=$(mktemp -d "$PWD/temp/runtime-smoke.XXXXXXXX")
          trap 'rm -rf "$work"' EXIT
          export MEDERI_RUNTIME_HOME="$work/runtime" UV_CACHE_DIR="$work/uv-cache"
          if [[ "${{ matrix.platform }}" == windows ]]; then
            export MEDERI_RUNTIME_HOME="$(cygpath -w "$MEDERI_RUNTIME_HOME")"
            export UV_CACHE_DIR="$(cygpath -w "$UV_CACHE_DIR")"
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(cygpath -w "$PWD/scripts/runtime/install.ps1")"
          elif [[ "${{ matrix.platform }}-${{ matrix.arch }}" == macos-x64 ]]; then
            /usr/bin/arch -x86_64 /bin/bash scripts/runtime/install.sh
          else
            /bin/bash scripts/runtime/install.sh
          fi
          export MEDERI_TEST_RUNTIME_HOME="$MEDERI_RUNTIME_HOME"

          test_args=(jvmTest test -x :app:androidApp:test --continue --no-configuration-cache)
          case "${{ matrix.platform }}-${{ matrix.arch }}" in
            macos-arm64)
              export CHROME_BIN='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
              ./gradlew allTests test --continue --no-configuration-cache
              ;;
            macos-x64)
              /usr/bin/arch -x86_64 /bin/bash ./gradlew "${test_args[@]}"
              ;;
            linux-*)
              MEDERI_REQUIRE_LINUX_SANDBOX=1 ./gradlew "${test_args[@]}"
              ;;
            *)
              ./gradlew "${test_args[@]}"
              ;;
          esac

      - name: Upload Failed Test Results
        if: failure() && steps.platform_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            **/build/test-results/**/TEST-*.xml
            **/build/reports/tests/**
          retention-days: 7

      - name: Test Release Packaging Script
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: python3 scripts/test-release-packaging.py

      - name: Cache Obscura Binary
        uses: actions/cache@v4
        with:
          path: temp/obscura-cache
          key: obscura-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('build_release.sh') }}
          restore-keys: |
            obscura-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Run Build Script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}-${{ matrix.arch }}" == macos-x64 ]]; then
            /usr/bin/arch -x86_64 /bin/bash ./build_release.sh --skip-sign
          else
            bash ./build_release.sh --skip-sign
          fi

      - name: Verify Bundled Server Java
        shell: bash
        run: |
          runtime=server/build/install/server-bundled/runtime
          java="$runtime/bin/java"
          if [[ "$RUNNER_OS" == Windows ]]; then java="$java.exe"; fi
          if ! java_settings=$("$java" -XshowSettings:properties -version 2>&1); then
            printf 'Cannot start the bundled Server Java\n%s\n' "$java_settings"
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*java\.specification\.version = 25[[:space:]]*$' <<< "$java_settings"; then
            printf 'Expected Java 25 in the bundled Server runtime\n%s\n' "$java_settings"
            exit 1
          fi
          modules=$("$java" --list-modules)
          if ! grep -Eq '^java\.base(@[^[:space:]]+)?[[:space:]]*$' <<< "$modules" ||
             grep -Eq '^jcef(@[^[:space:]]+)?[[:space:]]*$' <<< "$modules"; then
            printf 'Unexpected modules in the bundled Server runtime\n%s\n' "$modules"
            exit 1
          fi
          cef_file=$(find "$runtime" \( -iname '*jcef*' -o -iname 'libcef*' -o -iname 'cef_server*' -o -iname '*chromium*' \) -print -quit)
          if [[ -n "$cef_file" ]]; then
            printf 'Server runtime contains a CEF file: %s\n' "$cef_file"
            exit 1
          fi

      - name: Verify and Archive macOS Desktop
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          expected_arch=arm64
          if [[ "${{ matrix.arch }}" == x64 ]]; then
            expected_arch=x86_64
          fi
          echo "Expected macOS architecture: $expected_arch"
          apps=(release/*.app)
          if [[ ${#apps[@]} -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "Expected exactly one macOS app bundle in release/"
            exit 1
          fi
          app="${apps[0]}"
          launcher=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          for binary in "$app/Contents/MacOS/$launcher" \
            "$app/Contents/runtime/Contents/Home/lib/server/libjvm.dylib" \
            server/build/install/server-bundled/runtime/lib/server/libjvm.dylib; do
            actual_archs=$(lipo "$binary" -archs)
            echo "$binary: $actual_archs"
            if ! lipo "$binary" -verify_arch "$expected_arch"; then
              echo "Architecture mismatch for $binary: expected $expected_arch, found $actual_archs" >&2
              exit 1
            fi
          done
          tar -czf "release/$APP_NAME-desktop-macos-${{ matrix.arch }}.tar.gz" -C release "${app##*/}"

      - name: Upload Desktop
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/${{ env.APP_NAME }}-desktop-${{ matrix.platform }}-${{ matrix.arch }}.${{ env.ARCHIVE_EXTENSION }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Server with WasmJS
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-server-with-wasmjs-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/${{ env.APP_NAME }}-server-bundled-${{ matrix.platform }}-${{ matrix.arch }}.${{ env.ARCHIVE_EXTENSION }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Server API without WasmJS
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-server-api-without-wasmjs-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/${{ env.APP_NAME }}-server-api-${{ matrix.platform }}-${{ matrix.arch }}.${{ env.ARCHIVE_EXTENSION }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
